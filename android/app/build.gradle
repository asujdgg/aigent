plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.aigent.studio"
    compileSdk = 35
    buildToolsVersion = "34.0.0"
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.aigent.studio"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = 23
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName

        // Vosk 的 AAR 同时带 x86 / mips 库，手机用不到，去掉后 APK 从 94 MB
        // 降到 70 MB 左右；arm64 覆盖新机，armeabi-v7a 兜住老设备。
        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a"
        }
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig = signingConfigs.debug
            // Flutter 的 release 构建会跑 R8。JNA 靠反射读 Pointer.peer，
            // 不挂规则就会被改名，离线识别在真机上直接报
            // "Can't obtain peer field ID"（debug 包不会复现）。
            proguardFiles getDefaultProguardFile("proguard-android.txt"),
                    "proguard-rules.pro"
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    // 端侧离线识别：Vosk + JNA。模型不打进 APK，首次使用时在应用内下载，
    // 之后完全不联网。选它是因为 AAR 依赖干净，不要求 AGP 8.12+。
    implementation "com.alphacephei:vosk-android:0.3.47@aar"
    implementation "net.java.dev.jna:jna:5.13.0@aar"
}
